services:
  backend:
    image: ghcr.io/devmuhammed3/zerozone:latest
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
